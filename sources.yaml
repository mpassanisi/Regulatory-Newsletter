# =====================================================================
# Sources — LEVÉES BIOTECH/PHARMA BELGES · version RSS-first (robuste)
#
# Leçon apprise : les sites des invests (Noshaq, PMV...) sont rendus en
# JavaScript -> illisibles par le scraper simple. On mise donc sur des
# FLUX RSS d'agrégateurs qui couvrent leurs deals. Confirme les feeds
# marqués (?) au 1er run ; s'ils renvoient 0, voir la note en bas.
# =====================================================================

# ---- AGRÉGATEURS RSS (le cœur, haute valeur) ----
- id: aktus_cci
  type: rss
  url: https://aktus-cci.be/feed/          # (?) éco wallonne, couvre WE/invests/biotech
- id: biowin
  type: rss
  url: https://biowin.org/feed/            # (?) pôle santé wallon
- id: ccimag
  type: rss
  url: https://www.ccimag.be/feed/         # (?) magazine des entreprises (CCI)
- id: labiotech
  type: rss
  url: https://www.labiotech.eu/feed/      # confirmé OK
- id: sifted
  type: rss
  url: https://sifted.eu/feed              # confirmé OK (24 items)

# ---- INVESTS : best-effort scrape (peuvent rester à 0 si JS) ----
# Gardés au cas où une partie du contenu serait statique. Sans garantie.
- id: sambrinvest
  type: scrape
  url: https://www.sambrinvest.be/fr/actualites/biotechs/
  item_selector: "article, .news-item"
  title_selector: "h2, h3"
  link_selector: "a"
- id: biopark
  type: scrape
  url: https://www.biopark.be/news-7
  item_selector: "article, .news-card"
  title_selector: "h2, h3"
  link_selector: "a"
- id: orsafund
  type: scrape
  url: https://orsafund.be/actualites/
  item_selector: "article"
  title_selector: "h2, h3"
  link_selector: "a"

# ---- DÉSACTIVÉES (URL 404, ou bloquées 403, ou JS pur) --------------
# noshaq (JS) · wallonie_entreprendre (JS) · pmv (403) · lecho (403/payant)
# epimede/theodorus/newton/imecxpand/finance_brussels (404 : pas de page
#   news standard). Leurs deals notables passent via les agrégateurs RSS.
# fiercebiotech (flux introuvable) · maddymoney/france_biotech (non-belges)
