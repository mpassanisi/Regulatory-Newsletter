# =====================================================================
# Sources de veille — LEVÉES DE FONDS BIOTECH / PHARMA (focus Belgique)
#
#   - rss    : fiable, sans entretien. Toujours à privilégier.
#   - scrape : sélecteurs CSS à vérifier site par site (clic droit > Inspecter).
#
# MÉTHODE : après ce changement, laisse tourner le cron et lis les logs.
#   · une source à "0 items" AVEC erreur      -> URL/flux à corriger
#   · une source à "0 items" SANS erreur       -> sélecteurs à ajuster
#   · pour toute source en scrape, teste <url>/feed/ : si ça répond du XML,
#     bascule-la en rss (plus robuste).
# =====================================================================

# ============ CLUSTERS & AGRÉGATEURS D'ÉCOSYSTÈME (haut rendement) ====
# Relaient d'un coup les deals de toute la région : tes sources reines.

- id: biowin
  type: rss
  url: https://biowin.org/feed/          # WordPress — à confirmer au 1er run
  note: "Pôle santé wallon. Si 0 item, essayer https://biowin.org/fr/category/toute-lactualite/ en scrape."

- id: flandersbio
  type: scrape
  url: https://flanders.bio/en/news/
  item_selector: "article, .news-item"
  title_selector: "h2, h3"
  link_selector: "a"

